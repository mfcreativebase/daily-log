<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MY DAILY LOG">
<meta name="theme-color" content="#0f0c29">
<title>MY DAILY LOG</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600;700;900&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #0f0c29;
    --purple: #a78bfa;
    --purple-dim: rgba(167,139,250,0.15);
    --purple-border: rgba(167,139,250,0.35);
    --text: #e8e0f0;
    --text-dim: #8880aa;
    --card-bg: rgba(255,255,255,0.04);
    --card-border: rgba(255,255,255,0.07);
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Noto Sans JP', 'Hiragino Sans', sans-serif; overscroll-behavior: none; }
  body { display: flex; flex-direction: column; }
  #app { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

  .header { padding: calc(14px + var(--safe-top)) 16px 12px; background: rgba(255,255,255,0.03); border-bottom: 1px solid var(--card-border); text-align: center; flex-shrink: 0; }
  .header-title { font-size: 19px; font-weight: 900; letter-spacing: 0.1em; color: var(--purple); }
  .header-date { font-size: 12px; color: var(--text-dim); margin-top: 3px; }
  .today-badge { margin-left: 7px; background: var(--purple-dim); color: var(--purple); border-radius: 99px; padding: 1px 8px; font-size: 10px; font-weight: 700; }
  .date-nav { display: flex; gap: 8px; justify-content: center; margin-top: 8px; }
  .nav-btn { padding: 5px 14px; font-size: 12px; border-radius: 99px; background: transparent; border: 1px solid rgba(255,255,255,0.15); color: var(--text-dim); cursor: pointer; font-family: inherit; }
  .nav-btn.today { color: var(--purple); border-color: var(--purple); }

  .ring-wrap { display: flex; justify-content: center; padding: 16px 20px 8px; flex-shrink: 0; }
  .ring-container { position: relative; width: 100px; height: 100px; }
  .ring-container svg { transform: rotate(-90deg); }
  .ring-text { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .ring-pct { font-size: 22px; font-weight: 900; }
  .ring-label { font-size: 10px; color: var(--text-dim); letter-spacing: 0.1em; }

  .tabs { display: flex; border-bottom: 1px solid var(--card-border); flex-shrink: 0; }
  .tab { flex: 1; padding: 9px 2px; font-size: 11px; font-weight: 600; background: transparent; border: none; border-bottom: 2px solid transparent; color: #6b6484; cursor: pointer; font-family: inherit; letter-spacing: 0.03em; transition: all 0.2s; margin-bottom: -1px; }
  .tab.active { color: #c4b5fd; border-bottom-color: var(--purple); background: rgba(167,139,250,0.08); }

  .content { flex: 1; overflow-y: auto; padding: 12px 13px calc(16px + var(--safe-bottom)); -webkit-overflow-scrolling: touch; }

  .check-item { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 14px; padding: 12px 13px; margin-bottom: 8px; display: flex; align-items: center; gap: 10px; transition: all 0.2s; }
  .check-item.done { background: rgba(167,139,250,0.1); border-color: var(--purple-border); }
  .check-emoji { font-size: 19px; flex-shrink: 0; }
  .check-info { flex: 1; min-width: 0; }
  .check-name { font-size: 13px; font-weight: 600; color: #ccc; }
  .check-item.done .check-name { color: #c4b5fd; }
  .check-hint { font-size: 10px; color: var(--text-dim); margin-top: 2px; }
  .check-btn { width: 34px; height: 34px; border-radius: 50%; background: rgba(255,255,255,0.06); border: 2px solid rgba(255,255,255,0.15); color: #fff; font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; flex-shrink: 0; }
  .check-btn.done { background: var(--purple); border-color: var(--purple); }

  .count-ctrl { display: flex; align-items: center; gap: 5px; flex-shrink: 0; }
  .count-btn { width: 29px; height: 29px; border-radius: 50%; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12); color: #c4b5fd; font-size: 17px; cursor: pointer; font-family: inherit; display: flex; align-items: center; justify-content: center; font-weight: 700; line-height: 1; }
  .count-val { text-align: center; min-width: 34px; }
  .count-num { font-size: 17px; font-weight: 900; color: var(--text); }
  .count-num.done { color: var(--purple); }
  .count-unit { font-size: 9px; color: var(--text-dim); }

  .del-btn { width: 24px; height: 24px; border-radius: 50%; background: rgba(255,100,100,0.15); border: 1px solid rgba(255,100,100,0.25); color: #f87171; font-size: 13px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-left: 2px; }

  .card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; padding: 14px; margin-bottom: 13px; }
  .card-label { font-size: 12px; font-weight: 700; color: var(--purple); margin-bottom: 10px; letter-spacing: 0.06em; }
  textarea { width: 100%; min-height: 88px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 10px; color: var(--text); font-size: 14px; line-height: 1.7; resize: vertical; outline: none; font-family: inherit; }
  textarea::placeholder { color: var(--text-dim); }
  .summary-row { font-size: 13px; color: #b8b0d0; line-height: 2; }
  .summary-val { color: var(--purple); font-weight: 700; }

  .bar-item { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 10px; cursor: pointer; margin-bottom: 4px; }
  .bar-item.active-date { background: rgba(167,139,250,0.15); }
  .bar-date { font-size: 11px; color: var(--text-dim); min-width: 34px; }
  .bar-track { flex: 1; height: 6px; background: rgba(255,255,255,0.06); border-radius: 99px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 99px; transition: width 0.4s; }
  .bar-pct { font-size: 12px; font-weight: 700; color: #c4b5fd; min-width: 34px; text-align: right; }
  .chart-wrap { width: 100%; overflow: hidden; }
  svg.linechart text { font-family: 'Noto Sans JP', sans-serif; }

  /* カスタムタブ */
  .add-task-area { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
  .add-task-title { font-size: 12px; font-weight: 700; color: var(--purple); margin-bottom: 10px; }
  .add-task-emoji-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .emoji-opt { width: 34px; height: 34px; border-radius: 8px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .emoji-opt.selected { background: var(--purple-dim); border-color: var(--purple-border); }
  .add-row { display: flex; gap: 8px; margin-bottom: 8px; }
  .add-input { flex: 1; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); border-radius: 8px; padding: 9px 10px; color: var(--text); font-size: 13px; font-family: inherit; outline: none; }
  .add-input::placeholder { color: var(--text-dim); }
  .add-select { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); border-radius: 8px; padding: 9px 6px; color: var(--text); font-size: 12px; font-family: inherit; outline: none; }
  .add-btn { width: 100%; padding: 10px; background: var(--purple); border: none; border-radius: 10px; color: #fff; font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit; }
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <div class="header-title">✦ MY DAILY LOG ✦</div>
    <div class="header-date" id="headerDate"></div>
    <div class="date-nav">
      <button class="nav-btn" onclick="changeDate(-1)">‹ 前日</button>
      <button class="nav-btn today" onclick="goToday()">今日</button>
      <button class="nav-btn" onclick="changeDate(1)">翌日 ›</button>
    </div>
  </div>

  <div class="ring-wrap">
    <div class="ring-container">
      <svg width="100" height="100" viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="42" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="8"/>
        <circle id="ringCircle" cx="50" cy="50" r="42" fill="none" stroke="#a78bfa" stroke-width="8"
          stroke-linecap="round" stroke-dasharray="263.9" stroke-dashoffset="263.9"
          style="transition: stroke-dashoffset 0.6s ease, stroke 0.4s"/>
      </svg>
      <div class="ring-text">
        <div class="ring-pct" id="ringPct">0%</div>
        <div class="ring-label">達成率</div>
      </div>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('checklist',this)">📋 チェック</button>
    <button class="tab" onclick="switchTab('goal',this)">🎯 目標・報告</button>
    <button class="tab" onclick="switchTab('graph',this)">📊 グラフ</button>
    <button class="tab" onclick="switchTab('custom',this)">⚙️ カスタム</button>
  </div>

  <div class="content">
    <div id="tab-checklist"></div>
    <div id="tab-goal" style="display:none"></div>
    <div id="tab-graph" style="display:none"></div>
    <div id="tab-custom" style="display:none"></div>
  </div>
</div>

<script>
// ── 日付（タイムゾーンずれ対策）──
function todayKey() {
  const n = new Date();
  return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`;
}
function addDays(key, delta) {
  const [y,m,d] = key.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  dt.setDate(dt.getDate()+delta);
  return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
}
function keyToInfo(key) {
  const [y,m,d] = key.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  const wd = ['日','月','火','水','木','金','土'][dt.getDay()];
  return { full:`${y}/${String(m).padStart(2,'0')}/${String(d).padStart(2,'0')}（${wd}）`, m, d };
}

// ── 固定タスク ──
const FIXED = [
  {id:'earlyRise',  label:'早起き',                   emoji:'🌅', type:'check'},
  {id:'dogWalk',    label:'くぅの散歩',                emoji:'🐾', type:'check'},
  {id:'cigarette',  label:'煙草カウント',              emoji:'🚬', type:'count', unit:'本', max:10},
  {id:'laundry',    label:'洗濯',                      emoji:'👕', type:'check'},
  {id:'dishes',     label:'洗い物',                    emoji:'🍽️', type:'check'},
  {id:'chores',     label:'プラス家事（掃除・片付け）',emoji:'🏠', type:'check'},
  {id:'buymaPost',  label:'BUYMA 投稿',                emoji:'🛍️', type:'count', unit:'商品', min:3},
  {id:'buymaImage', label:'BUYMA 画像作成',            emoji:'🖼️', type:'count', unit:'商品', min:3},
  {id:'design',     label:'デザイン作業',              emoji:'✏️', type:'count', unit:'商品', min:1},
  {id:'youtube',    label:'YouTube 勉強',              emoji:'▶️', type:'check'},
  {id:'walking',    label:'やすしとウォーキング',      emoji:'🚶', type:'count', unit:'分'},
];

const EMOJIS = ['⭐','🔥','💪','📚','🎯','🌿','💊','🧹','🏃','🎨','🛒','💻','📝','🎵','🍎','💧','🧘','📞','🌙','✅','🍀','🎪'];

let activeDate = todayKey();
let selectedEmoji = '⭐';

// ── ストレージ ──
function load() { try{return JSON.parse(localStorage.getItem('dl')||'{}')}catch{return{}} }
function save(d) { localStorage.setItem('dl',JSON.stringify(d)) }
function getDay(k) { const s=load(); return s[k]||{checks:{},counts:{},goal:'',report:''} }
function setDay(k,d) { const s=load(); s[k]=d; save(s) }
function loadCustom() { try{return JSON.parse(localStorage.getItem('ct')||'[]')}catch{return[]} }
function saveCustom(t) { localStorage.setItem('ct',JSON.stringify(t)) }

function allItems() { return [...FIXED, ...loadCustom()]; }

function isDone(item, data) {
  if (item.type==='check') return !!data.checks[item.id];
  const v = parseInt(data.counts[item.id]||0);
  if (item.id==='cigarette') return v>0 && v<=10;
  if (item.min) return v>=item.min;
  return v>0;
}

function calcPct(date) {
  const items=allItems(), data=getDay(date);
  if (!items.length) return 0;
  return Math.round(items.filter(i=>isDone(i,data)).length/items.length*100);
}

// ── UI ──
function updateRing(pct) {
  const circ=2*Math.PI*42;
  document.getElementById('ringCircle').style.strokeDashoffset=circ*(1-pct/100);
  document.getElementById('ringCircle').style.stroke=pct>=80?'#a78bfa':pct>=50?'#f472b6':'#fb923c';
  document.getElementById('ringPct').textContent=pct+'%';
}

function updateHeader() {
  const {full}=keyToInfo(activeDate);
  const isToday=activeDate===todayKey();
  document.getElementById('headerDate').innerHTML=full+(isToday?'<span class="today-badge">TODAY</span>':'');
}

// ── チェックリスト ──
function renderChecklist() {
  const data=getDay(activeDate);
  let html='';
  allItems().forEach(item=>{
    const done=isDone(item,data);
    const v=parseInt(data.counts[item.id]||0);
    const isFixed=FIXED.find(f=>f.id===item.id);
    let hint='';
    if (item.id==='cigarette') hint='10本以内で達成';
    else if (item.min) hint=`最低${item.min}${item.unit}で達成`;

    const delBtn=isFixed?'':`<button class="del-btn" onclick="deleteTask('${item.id}')">✕</button>`;

    const ctrl=item.type==='check'
      ?`<button class="check-btn${done?' done':''}" onclick="toggleCheck('${item.id}')">${done?'✓':''}</button>`
      :`<div class="count-ctrl">
          <button class="count-btn" onclick="adjustCount('${item.id}',-1)">－</button>
          <div class="count-val"><div class="count-num${done?' done':''}">${v}</div><div class="count-unit">${item.unit||''}</div></div>
          <button class="count-btn" onclick="adjustCount('${item.id}',1)">＋</button>
        </div>`;

    html+=`<div class="check-item${done?' done':''}">
      <span class="check-emoji">${item.emoji}</span>
      <div class="check-info">
        <div class="check-name">${item.label}</div>
        ${hint?`<div class="check-hint">${hint}</div>`:''}
      </div>
      ${ctrl}${delBtn}
    </div>`;
  });
  document.getElementById('tab-checklist').innerHTML=html||'<div style="color:var(--text-dim);text-align:center;padding:30px">タスクがありません</div>';
}

// ── 目標・報告 ──
function renderGoal() {
  const data=getDay(activeDate), pct=calcPct(activeDate);
  const cig=parseInt(data.counts['cigarette']||0);
  document.getElementById('tab-goal').innerHTML=`
    <div class="card"><div class="card-label">🎯 今日の目標</div>
      <textarea id="goalIn" placeholder="今日やること、意識すること...">${data.goal||''}</textarea></div>
    <div class="card"><div class="card-label">📝 成果・報告</div>
      <textarea id="repIn" style="min-height:120px" placeholder="今日できたこと、気づいたこと...">${data.report||''}</textarea></div>
    <div class="card" style="background:rgba(167,139,250,0.07)"><div class="card-label">📊 本日のサマリー</div>
      <div class="summary-row">
        達成率：<span class="summary-val">${pct}%</span><br>
        煙草：<span class="summary-val">${cig}本</span> ${cig>0&&cig<=10?'✓ 達成':cig>10?'⚠ オーバー':''}<br>
        BUYMA投稿：<span class="summary-val">${data.counts['buymaPost']||0}商品</span><br>
        BUYMA画像：<span class="summary-val">${data.counts['buymaImage']||0}商品</span><br>
        デザイン：<span class="summary-val">${data.counts['design']||0}商品</span><br>
        ウォーキング：<span class="summary-val">${data.counts['walking']||0}分</span>
      </div></div>`;
  document.getElementById('goalIn').addEventListener('input',e=>{const d=getDay(activeDate);d.goal=e.target.value;setDay(activeDate,d)});
  document.getElementById('repIn').addEventListener('input',e=>{const d=getDay(activeDate);d.report=e.target.value;setDay(activeDate,d)});
}

// ── グラフ ──
function renderGraph() {
  const days=[];
  for(let i=13;i>=0;i--){
    const key=addDays(todayKey(),-i);
    const {m,d}=keyToInfo(key);
    days.push({key,label:`${m}/${d}`,pct:calcPct(key)});
  }
  const W=320,H=140,pL=28,pR=10,pT=14,pB=24,iW=W-pL-pR,iH=H-pT-pB;
  const pts=days.map((d,i)=>({x:pL+(i/(days.length-1))*iW,y:pT+(1-d.pct/100)*iH,...d}));
  const pathD=pts.map((p,i)=>`${i===0?'M':'L'}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
  const fillD=pathD+` L${pts[pts.length-1].x},${pT+iH} L${pts[0].x},${pT+iH} Z`;
  const labels=days.filter((_,i)=>i%2===0).map((d,li)=>{
    const x=pL+(li*2/(days.length-1))*iW;
    return `<text x="${x.toFixed(1)}" y="${H-4}" text-anchor="middle" font-size="9" fill="#8880aa">${d.label}</text>`;
  }).join('');
  const yLines=[0,25,50,75,100].map(v=>{
    const y=pT+(1-v/100)*iH;
    return `<line x1="${pL}" y1="${y.toFixed(1)}" x2="${W-pR}" y2="${y.toFixed(1)}" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
            <text x="${pL-3}" y="${(y+3).toFixed(1)}" text-anchor="end" font-size="8" fill="#8880aa">${v}</text>`;
  }).join('');
  const bars=days.slice().reverse().map(d=>{
    const c=d.pct>=80?'#a78bfa':d.pct>=50?'#f472b6':'#fb923c';
    return `<div class="bar-item${d.key===activeDate?' active-date':''}" onclick="jumpDate('${d.key}')">
      <div class="bar-date">${d.label}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${d.pct}%;background:${c}"></div></div>
      <div class="bar-pct">${d.pct}%</div></div>`;
  }).join('');
  document.getElementById('tab-graph').innerHTML=`
    <div class="card"><div class="card-label">📈 14日間の達成率推移</div>
      <div class="chart-wrap"><svg class="linechart" viewBox="0 0 ${W} ${H}" width="100%" style="display:block">
        ${yLines}
        <defs><linearGradient id="fg" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.3"/>
          <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
        </linearGradient></defs>
        <path d="${fillD}" fill="url(#fg)"/>
        <path d="${pathD}" fill="none" stroke="#a78bfa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        ${pts.map(p=>`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3.5" fill="#a78bfa"/>`).join('')}
        ${labels}
      </svg></div></div>
    <div class="card"><div class="card-label">📅 日別達成率（タップで移動）</div>${bars}</div>`;
}

// ── カスタムタスク ──
function renderCustom() {
  const tasks=loadCustom();
  const emojiGrid=EMOJIS.map(e=>`<div class="emoji-opt${e===selectedEmoji?' selected':''}" onclick="selEmoji('${e}')">${e}</div>`).join('');
  const taskList=tasks.length
    ?tasks.map(t=>`<div class="check-item" style="margin-bottom:7px">
        <span class="check-emoji">${t.emoji}</span>
        <div class="check-info">
          <div class="check-name">${t.label}</div>
          <div class="check-hint">${t.type==='count'?`カウント（${t.unit||'回'}）${t.min?'/ 最低'+t.min+t.unit:''}`:'チェック'}</div>
        </div>
        <button class="del-btn" onclick="deleteTask('${t.id}')">✕</button>
      </div>`).join('')
    :'<div style="color:var(--text-dim);font-size:12px;text-align:center;padding:12px">カスタムタスクなし</div>';

  document.getElementById('tab-custom').innerHTML=`
    <div class="add-task-area">
      <div class="add-task-title">➕ 新しいタスクを追加</div>
      <div class="add-task-emoji-row">${emojiGrid}</div>
      <div class="add-row">
        <input class="add-input" id="tName" placeholder="タスク名（例：読書）" maxlength="20">
        <select class="add-select" id="tType" onchange="toggleCountOpts()">
          <option value="check">チェック</option>
          <option value="count">カウント</option>
        </select>
      </div>
      <div class="add-row" id="countOpts" style="display:none">
        <input class="add-input" id="tUnit" placeholder="単位（例：ページ）" maxlength="6">
        <input class="add-input" id="tMin" placeholder="最低数（任意）" type="number" min="0" style="max-width:110px">
      </div>
      <button class="add-btn" onclick="addTask()">追加する</button>
    </div>
    <div class="card"><div class="card-label">📋 カスタムタスク一覧</div>${taskList}</div>`;
}

function selEmoji(e) { selectedEmoji=e; renderCustom(); }
function toggleCountOpts() {
  const v=document.getElementById('tType').value;
  document.getElementById('countOpts').style.display=v==='count'?'flex':'none';
}

function addTask() {
  const name=(document.getElementById('tName').value||'').trim();
  if (!name){alert('タスク名を入力してください');return;}
  const type=document.getElementById('tType').value;
  const unit=type==='count'?(document.getElementById('tUnit').value.trim()||'回'):'';
  const min=type==='count'?parseInt(document.getElementById('tMin').value||0):0;
  const tasks=loadCustom();
  const t={id:'c'+Date.now(),label:name,emoji:selectedEmoji,type,unit};
  if(type==='count'&&min>0) t.min=min;
  tasks.push(t);
  saveCustom(tasks);
  selectedEmoji='⭐';
  renderCustom();
  renderChecklist();
  updateRing(calcPct(activeDate));
}

function deleteTask(id) {
  if(!confirm('このタスクを削除しますか？'))return;
  saveCustom(loadCustom().filter(t=>t.id!==id));
  renderCustom();
  renderChecklist();
  updateRing(calcPct(activeDate));
}

// ── インタラクション ──
function toggleCheck(id) {
  const d=getDay(activeDate); d.checks[id]=!d.checks[id]; setDay(activeDate,d);
  renderChecklist(); updateRing(calcPct(activeDate));
}
function adjustCount(id,delta) {
  const d=getDay(activeDate); d.counts[id]=Math.max(0,(parseInt(d.counts[id]||0))+delta); setDay(activeDate,d);
  renderChecklist(); updateRing(calcPct(activeDate));
}
function jumpDate(key) { activeDate=key; renderAll(); switchTab('checklist',document.querySelectorAll('.tab')[0]); }

let currentTab='checklist';
function switchTab(name,btn) {
  currentTab=name;
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  ['checklist','goal','graph','custom'].forEach(t=>{ document.getElementById('tab-'+t).style.display=t===name?'block':'none'; });
  if(name==='checklist') renderChecklist();
  if(name==='goal') renderGoal();
  if(name==='graph') renderGraph();
  if(name==='custom') renderCustom();
}

function renderAll() {
  updateHeader(); updateRing(calcPct(activeDate));
  if(currentTab==='checklist') renderChecklist();
  if(currentTab==='goal') renderGoal();
  if(currentTab==='graph') renderGraph();
  if(currentTab==='custom') renderCustom();
}

// 翌日以降も自由に移動可能
function changeDate(delta) { activeDate=addDays(activeDate,delta); renderAll(); }
function goToday() { activeDate=todayKey(); renderAll(); }
