<!DOCTYPE html>																	
<html lang="ja">																	
<head>																	
<meta charset="UTF-8">																	
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">																	
<meta name="apple-mobile-web-app-capable" content="yes">																	
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">																	
<meta name="apple-mobile-web-app-title" content="MY DAILY LOG">																	
<meta name="theme-color" content="#0f0c29">																	
<title>MY DAILY LOG</title>																	
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600;700;900&display=swap" rel="stylesheet">																	
																	
<style>																	
:root {																	
--bg: #0f0c29;																	
--purple: #a78bfa;																	
--purple-dim: rgba(167,139,250,0.15);																	
--purple-border: rgba(167,139,250,0.35);																	
--text: #e8e0f0;																	
--text-dim: #8880aa;																	
--card-bg: rgba(255,255,255,0.04);																	
--card-border: rgba(255,255,255,0.07);																	
--safe-top: env(safe-area-inset-top, 0px);																	
--safe-bottom: env(safe-area-inset-bottom, 0px);																	
}																	
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }																	
html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Noto Sans JP', 'Hiragino Sans', sans-serif; overscroll-behavior: none; }																	
body { display: flex; flex-direction: column; }																	
#app { flex: 1; display: flex; flex-direction: column; overflow: hidden; }																	
																	
.header { padding: calc(14px + var(--safe-top)) 16px 12px; background: rgba(255,255,255,0.03); border-bottom: 1px solid var(--card-border); text-align: center; flex-shrink: 0; }																	
.header-title { font-size: 19px; font-weight: 900; letter-spacing: 0.1em; color: var(--purple); }																	
.header-date { font-size: 12px; color: var(--text-dim); margin-top: 3px; }																	
.today-badge { margin-left: 7px; background: var(--purple-dim); color: var(--purple); border-radius: 99px; padding: 1px 8px; font-size: 10px; font-weight: 700; }																	
.date-nav { display: flex; gap: 8px; justify-content: center; margin-top: 8px; }																	
.nav-btn { padding: 5px 14px; font-size: 12px; border-radius: 99px; background: transparent; border: 1px solid rgba(255,255,255,0.15); color: var(--text-dim); cursor: pointer; font-family: inherit; }																	
.nav-btn.today { color: var(--purple); border-color: var(--purple); }																	
																	
.ring-wrap { display: flex; justify-content: center; padding: 16px 20px 8px; flex-shrink: 0; }																	
.ring-container { position: relative; width: 100px; height: 100px; }																	
.ring-container svg { transform: rotate(-90deg); }																	
.ring-text { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }																	
.ring-pct { font-size: 22px; font-weight: 900; }																	
.ring-label { font-size: 10px; color: var(--text-dim); letter-spacing: 0.1em; }																	
																	
.tabs { display: flex; border-bottom: 1px solid var(--card-border); flex-shrink: 0; }																	
.tab { flex: 1; padding: 9px 2px; font-size: 11px; font-weight: 600; background: transparent; border: none; border-bottom: 2px solid transparent; color: #6b6484; cursor: pointer; font-family: inherit; letter-spacing: 0.03em; transition: all 0.2s; margin-bottom: -1px; }																	
.tab.active { color: #c4b5fd; border-bottom-color: var(--purple); background: rgba(167,139,250,0.08); }																	
																	
.content { flex: 1; overflow-y: auto; padding: 12px 13px calc(16px + var(--safe-bottom)); -webkit-overflow-scrolling: touch; }																	
																	
.check-item { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 14px; padding: 12px 13px; margin-bottom: 8px; display: flex; align-items: center; gap: 10px; transition: all 0.2s; }																	
.check-item.done { background: rgba(167,139,250,0.1); border-color: var(--purple-border); }																	
.check-emoji { font-size: 19px; flex-shrink: 0; }																	
.check-info { flex: 1; min-width: 0; }																	
.check-name { font-size: 13px; font-weight: 600; color: #ccc; }																	
.check-item.done .check-name { color: #c4b5fd; }																	
.check-hint { font-size: 10px; color: var(--text-dim); margin-top: 2px; }																	
.check-btn { width: 34px; height: 34px; border-radius: 50%; background: rgba(255,255,255,0.06); border: 2px solid rgba(255,255,255,0.15); color: #fff; font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; flex-shrink: 0; }																	
.check-btn.done { background: var(--purple); border-color: var(--purple); }																	
																	
.count-ctrl { display: flex; align-items: center; gap: 5px; flex-shrink: 0; }																	
.count-btn { width: 29px; height: 29px; border-radius: 50%; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12); color: #c4b5fd; font-size: 17px; cursor: pointer; font-family: inherit; display: flex; align-items: center; justify-content: center; font-weight: 700; line-height: 1; }																	
.count-val { text-align: center; min-width: 34px; }																	
.count-num { font-size: 17px; font-weight: 900; color: var(--text); }																	
.count-num.done { color: var(--purple); }																	
.count-unit { font-size: 9px; color: var(--text-dim); }																	
																	
.del-btn { width: 24px; height: 24px; border-radius: 50%; background: rgba(255,100,100,0.15); border: 1px solid rgba(255,100,100,0.25); color: #f87171; font-size: 13px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-left: 2px; }																	
																	
.card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; padding: 14px; margin-bottom: 13px; }																	
.card-label { font-size: 12px; font-weight: 700; color: var(--purple); margin-bottom: 10px; letter-spacing: 0.06em; }																	
textarea { width: 100%; min-height: 88px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 10px; color: var(--text); font-size: 14px; line-height: 1.7; resize: vertical; outline: none; font-family: inherit; }																	
textarea::placeholder { color: var(--text-dim); }																	
.summary-row { font-size: 13px; color: #b8b0d0; line-height: 2; }																	
.summary-val { color: var(--purple); font-weight: 700; }																	
																	
.bar-item { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 10px; cursor: pointer; margin-bottom: 4px; }																	
.bar-item.active-date { background: rgba(167,139,250,0.15); }																	
.bar-date { font-size: 11px; color: var(--text-dim); min-width: 34px; }																	
.bar-track { flex: 1; height: 6px; background: rgba(255,255,255,0.06); border-radius: 99px; overflow: hidden; }																	
.bar-fill { height: 100%; border-radius: 99px; transition: width 0.4s; }																	
.bar-pct { font-size: 12px; font-weight: 700; color: #c4b5fd; min-width: 34px; text-align: right; }																	
.chart-wrap { width: 100%; overflow: hidden; }																	
svg.linechart text { font-family: 'Noto Sans JP', sans-serif; }																	
																	
.add-task-area { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 14px; padding: 14px; margin-bottom: 12px; }																	
.add-task-title { font-size: 12px; font-weight: 700; color: var(--purple); margin-bottom: 10px; }																	
.add-task-note { font-size: 11px; color: #f59e0b; background: rgba(245,158,11,0.1); border-radius: 8px; padding: 7px 10px; margin-bottom: 10px; }																	
.add-task-emoji-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }																	
.emoji-opt { width: 34px; height: 34px; border-radius: 8px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }																	
.emoji-opt.selected { background: var(--purple-dim); border-color: var(--purple-border); }																	
.add-row { display: flex; gap: 8px; margin-bottom: 8px; }																	
.add-input { flex: 1; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); border-radius: 8px; padding: 9px 10px; color: var(--text); font-size: 13px; font-family: inherit; outline: none; }																	
.add-input::placeholder { color: var(--text-dim); }																	
.add-select { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); border-radius: 8px; padding: 9px 6px; color: var(--text); font-size: 12px; font-family: inherit; outline: none; }																	
.add-btn { width: 100%; padding: 10px; background: var(--purple); border: none; border-radius: 10px; color: #fff; font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit; }																	
</style>
